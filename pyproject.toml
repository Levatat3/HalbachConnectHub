[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halbach-connecthub"
version = "0.2.0"
description = "Halbach ConnectHub: choose what your personal site shows, from a window on your own PC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler (Levatat3)", email = "levbot.py@gmail.com" }]
dependencies = []

[project.scripts]
halbach = "halbach_connecthub.__main__:main"

[tool.setuptools]
packages = ["halbach_connecthub"]

[tool.setuptools.package-data]
halbach_connecthub = ["ui/*"]
