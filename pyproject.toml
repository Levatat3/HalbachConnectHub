[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connecthub"
version = "0.1.0"
description = "Choose what your personal site shows, from a window on your own PC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler (Levatat3)", email = "levbot.py@gmail.com" }]
dependencies = []

[project.scripts]
connecthub = "connecthub.__main__:main"

[tool.setuptools]
packages = ["connecthub"]

[tool.setuptools.package-data]
connecthub = ["ui/*"]
